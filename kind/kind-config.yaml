# kind cluster config: 1 control-plane + 4 worker nodes.
# Each worker gets a role label (applied after cluster creation) so you can
# pin mongo, backend, frontend, and notification-service to separate nodes
# via nodeSelector.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
  - role: worker
  - role: worker
  - role: worker
  - role: worker
