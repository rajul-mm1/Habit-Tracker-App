server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Support client-side routing (React Router) - any unknown path
    # falls back to index.html instead of a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache env.js - it's regenerated at container start and must
    # always reflect the current environment's API URL.
    location /env.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
