image:
  repository: "161805283944.dkr.ecr.us-west-2.amazonaws.com/frontend"
  tag: "98ce112842502f6b6056532a92a6704bd576dcf6"
  pullPolicy: IfNotPresent
imagePullSecrets: []
replicaCount: 2
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  host: habittracker.32.188.82.206.nip.io
  path: /
  pathType: Prefix
config:
  # Consumed by docker-entrypoint.sh (which reads $API_URL) to regenerate
  # env.js at container start - see src/api/client.js. Every frontend API
  # call already includes the "/api" prefix (e.g. client.post('/api/auth/login')),
  # so this must be the origin only. Empty string means same-origin: the
  # browser calls e.g. https://habittracker.local/api/... and the Ingress
  # (path /api(/|$)(.*)) routes that to the backend Service - no separate
  # host, no CORS. This name and semantics must match docker-entrypoint.sh.
  API_URL: ""
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi
nodeSelector: {}
tolerations: []
affinity: {}
