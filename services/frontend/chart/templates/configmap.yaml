apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ include "chart.fullname" . }}-config
  labels:
    {{- include "chart.labels" . | nindent 4 }}

data:
  # Must be named API_URL - docker-entrypoint.sh reads this exact env var
  # name to regenerate env.js at container start.
  API_URL: {{ .Values.config.API_URL | quote }}