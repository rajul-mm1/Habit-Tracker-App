image:
  repository: "161805283944.dkr.ecr.us-west-2.amazonaws.com/cron-checker"
  tag: "ac361cd12e68249fd2d8a0a7dd544002650a9085"
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
cronJob:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  restartPolicy: Never
  backoffLimit: 3
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi
config:
  # Must match the backend chart's Service name. With releaseName "backend"
  # and chart name "backend", the fullname helper resolves to "backend" (not
  # "backend-service") - see argocd/applications/backend.yml.
  BACKEND_URL: "http://backend:5000"
  NOTIFY_URL: "http://notification-service:5001"
externalSecrets:
  enabled: true
  storeName: aws-secrets-manager
  appSecretsKey: habit-tracker/app-secrets
  refreshInterval: 1h
secret:
  # Only read when externalSecrets.enabled is false. Never commit a real
  # value here - see values.local.yaml.example in this chart directory.
  # Must match the backend's INTERNAL_SECRET exactly (it's how cron-checker
  # authenticates its calls to the backend's internal missed-check-in
  # endpoint).
  INTERNAL_SECRET: ""
alerts:
  enabled: true
nodeSelector: {}
tolerations: []
affinity: {}
