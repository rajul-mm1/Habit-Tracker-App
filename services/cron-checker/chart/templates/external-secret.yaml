{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}

spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}

  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore

  target:
    name: {{ include "chart.fullname" . }}-secret
    creationPolicy: Owner

  data:
    # Same AWS Secrets Manager entry the backend chart reads INTERNAL_SECRET
    # from - guarantees the two services can never end up with mismatched
    # values (which would silently break cron-checker's calls to backend).
    - secretKey: INTERNAL_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.appSecretsKey }}
        property: INTERNAL_SECRET
{{- end }}
