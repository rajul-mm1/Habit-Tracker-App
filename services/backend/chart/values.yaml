replicaCount: 1
image:
  repository: "161805283944.dkr.ecr.us-west-2.amazonaws.com/backend"
  pullPolicy: IfNotPresent
  tag: "65684f97322a2863b2fd7ccaa74843ca1a13ee09"
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
service:
  type: ClusterIP
  port: 5000
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: "/$2"
  host: habittracker.32.188.82.206.nip.io
  path: /api(/|$)(.*)
  pathType: ImplementationSpecific
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
pdb:
  enabled: true
  minAvailable: 1
serviceMonitor:
  enabled: true
  interval: 30s
  path: /metrics
config:
  PORT: "5000"
  MONGO_URL: "mongodb://mongodb:27017/habit_tracker"
  NOTIFY_URL: "http://notification-service:5001"
externalSecrets:
  # When true (default, used by the real ArgoCD-managed deployment), this
  # chart's Secret is created by an ExternalSecret pulling from AWS Secrets
  # Manager (see templates/external-secret.yaml) instead of from the
  # `secret:` values below - ArgoCD never sees a real secret value, only
  # this reference. Set to false only for manual/local `helm install`
  # without ESO in the cluster, and fill in `secret:` below via
  # values.local.yaml instead.
  enabled: true
  storeName: aws-secrets-manager # must match infra/external-secrets-store/chart's values.yaml `name`
  appSecretsKey: habit-tracker/app-secrets # must match terraform/secrets.tf's aws_secretsmanager_secret.app_secrets name
  refreshInterval: 1h
secret:
  # Only read when externalSecrets.enabled is false. Never commit real
  # values here. Provide them at deploy time via
  # values.local.yaml (gitignored - copy values.local.yaml.example next to
  # this file) or --set, e.g.:
  #   helm upgrade --install backend services/backend/chart \
  #     -f services/backend/chart/values.yaml \
  #     -f services/backend/chart/values.local.yaml
  # In production, prefer sourcing these from the External Secrets Operator
  # IRSA role already provisioned in terraform/iam.tf instead of Helm values.
  JWT_SECRET: ""
  INTERNAL_SECRET: ""
livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3
startupProbe:
  httpGet:
    path: /health
    port: http
  failureThreshold: 30
  periodSeconds: 10
nodeSelector: {}
tolerations: []
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          topologyKey: kubernetes.io/hostname
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - backend
