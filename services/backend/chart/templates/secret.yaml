{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret

metadata:
  name: {{ include "chart.fullname" . }}-secret
  labels:
    {{- include "chart.labels" . | nindent 4 }}

type: Opaque

data:
  JWT_SECRET: {{ required "secret.JWT_SECRET is empty - set it via values.local.yaml or --set (never commit a real value); see services/backend/chart/values.local.yaml.example" .Values.secret.JWT_SECRET | b64enc | quote }}
  INTERNAL_SECRET: {{ required "secret.INTERNAL_SECRET is empty - set it via values.local.yaml or --set (never commit a real value); see services/backend/chart/values.local.yaml.example" .Values.secret.INTERNAL_SECRET | b64enc | quote }}
{{- end }}