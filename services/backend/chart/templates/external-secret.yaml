{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret

metadata:
  name: {{ include "chart.fullname" . }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}

spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}

  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore

  # Same name/shape as the Secret templates/secret.yaml would have created,
  # so nothing else in this chart (deployment.yaml's secretRef) needs to
  # know or care whether the value came from Helm values or ESO.
  target:
    name: {{ include "chart.fullname" . }}-secret
    creationPolicy: Owner

  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.appSecretsKey }}
        property: JWT_SECRET
    - secretKey: INTERNAL_SECRET
      remoteRef:
        key: {{ .Values.externalSecrets.appSecretsKey }}
        property: INTERNAL_SECRET
{{- end }}
