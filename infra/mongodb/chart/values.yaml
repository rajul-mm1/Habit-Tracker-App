replicaCount: 1

image:
  repository: mongo
  tag: "7"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: "mongodb" # backend/cron-checker connect to "mongodb:27017" - keep this stable

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext:
  fsGroup: 999 # official mongo image runs as uid/gid 999

securityContext:
  runAsNonRoot: true
  runAsUser: 999
  runAsGroup: 999
  allowPrivilegeEscalation: false
  # NOTE: unlike the Node.js services' charts, this does NOT set
  # readOnlyRootFilesystem - mongod needs to write to paths outside
  # /data/db (e.g. /tmp) that aren't worth enumerating individually here.
  capabilities:
    drop:
      - ALL

service:
  # ClusterIP (not headless) is enough for a single-replica StatefulSet -
  # backend/cron-checker only ever need the stable Service DNS name
  # "mongodb", not per-pod identity.
  type: ClusterIP
  port: 27017

# Database created lazily by the driver on first write, but declaring it
# here keeps intent explicit and gives mongod an initial DB to log against.
config:
  MONGO_INITDB_DATABASE: "habit_tracker"

# ---------------------------------------------------------------------------
# AUTH
# Disabled by default to match the current MONGO_URL used across
# docker-compose.yml and the backend chart (mongodb://mongodb:27017/...,
# no credentials) - this is a demo/portfolio-scale project, not a production
# cluster. To harden for production:
#   1. Set auth.enabled: true (adds MONGO_INITDB_ROOT_USERNAME/PASSWORD env
#      vars sourced from a Secret, and mongod --auth)
#   2. Update backend's MONGO_URL (services/backend/chart/values.yaml) to
#      mongodb://<user>:<password>@mongodb:27017/habit_tracker?authSource=admin
#   3. Prefer sourcing the password via the External Secrets Operator IRSA
#      role already provisioned in terraform/iam.tf (currently unused).
# ---------------------------------------------------------------------------
auth:
  enabled: false
  rootUsername: "root"
  # Only read when auth.enabled is true AND externalSecrets.enabled is
  # false. Never commit a real value here - see values.local.yaml.example
  # in this chart directory.
  rootPassword: ""

externalSecrets:
  # Only relevant when auth.enabled is true. When true (default), the root
  # credentials Secret is created by an ExternalSecret pulling from AWS
  # Secrets Manager instead of from `auth.rootPassword` above.
  enabled: true
  storeName: aws-secrets-manager
  mongodbSecretsKey: habit-tracker/mongodb # must match terraform/secrets.tf's aws_secretsmanager_secret.mongodb name
  refreshInterval: 1h

persistence:
  enabled: true
  size: 5Gi
  storageClassName: "ebs-gp3" # EKS Auto Mode's built-in default StorageClass (see terraform/main.tf)
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

livenessProbe:
  exec:
    command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
  initialDelaySeconds: 30
  periodSeconds: 15
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  exec:
    command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

startupProbe:
  exec:
    command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
  periodSeconds: 5
  failureThreshold: 30

nodeSelector: {}
tolerations: []
affinity: {}
