{{- if and .Values.auth.enabled (not .Values.externalSecrets.enabled) }}
apiVersion: v1
kind: Secret

metadata:
  name: {{ include "chart.fullname" . }}-secret
  labels:
    {{- include "chart.labels" . | nindent 4 }}

type: Opaque

data:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.auth.rootUsername | b64enc | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ required "auth.rootPassword is empty but auth.enabled is true - set it via values.local.yaml or --set (never commit a real value); see infra/mongodb/chart/values.local.yaml.example" .Values.auth.rootPassword | b64enc | quote }}
{{- end }}
