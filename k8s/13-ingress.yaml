# Requires an Ingress controller installed in the cluster
# (e.g. `minikube addons enable ingress`, or nginx-ingress via Helm on a
# real cluster).
#
# Routes both the frontend and the backend API under ONE public hostname,
# which is what lets the React app call relative paths like "/api/..."
# from the browser without CORS or cluster-internal-DNS issues.
#
# No path rewriting is used deliberately: the backend's Express routes are
# already mounted at "/api/..." (see backend/server.js), so the full
# incoming path is forwarded as-is to backend-service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: habit-tracker-ingress
  namespace: habit-tracker
spec:
  ingressClassName: nginx
  rules:
    - host: habit-tracker.local   # replace with your real domain in production
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
