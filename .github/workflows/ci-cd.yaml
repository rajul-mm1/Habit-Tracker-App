name: Build and Push Docker Images

# Runs tests/builds on every PR, and only pushes images to the registry
# when changes land on main - avoids polluting the registry with images
# from half-finished branches.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  DOCKERHUB_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  # ------------------------------------------------------------------
  # Lint/sanity-check each Node.js service before anything gets built.
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, notification-service, cron-checker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm install

      - name: Syntax check
        working-directory: ${{ matrix.service }}
        run: node --check server.js 2>/dev/null || node --check index.js

  # ------------------------------------------------------------------
  # Build + push images. Only runs on main, and only after tests pass.
  # ------------------------------------------------------------------
  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            image: habit-backend
          - service: frontend
            image: habit-frontend
          - service: notification-service
            image: habit-notification-service
          - service: cron-checker
            image: habit-cron-checker
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ------------------------------------------------------------------
  # Optional: deploy to a cluster after images are pushed.
  # Requires a KUBE_CONFIG secret containing a valid kubeconfig.
  # Commented out by default - uncomment once your cluster is reachable
  # from GitHub Actions (e.g. a cloud-hosted cluster, not a local Minikube).
