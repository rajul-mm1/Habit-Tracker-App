name: CI/CD Pipeline

# ─────────────────────────────────────────────────────────────────────────────
#  TRIGGER
#  pull_request → main   CI only  : test → build → trivy scan
#  push        → main   CI + CD  : above + push to ECR + update Helm values
#  workflow_dispatch     Manual trigger — forces ALL services to build
# ─────────────────────────────────────────────────────────────────────────────
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # AWS OIDC
  contents: write   # push Helm tag updates back to repo

env:
  AWS_REGION:   us-west-2
  IMAGE_TAG:    ${{ github.sha }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-west-2.amazonaws.com

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  #  JOB 0 ── detect-changes
  #  Uses dorny/paths-filter to output true/false per service.
  #  Downstream jobs use these outputs in their if conditions.
  # ═══════════════════════════════════════════════════════════════════════════
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest

    outputs:
      backend:              ${{ steps.filter.outputs.backend }}
      frontend:             ${{ steps.filter.outputs.frontend }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      cron-checker:         ${{ steps.filter.outputs.cron-checker }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check which services changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          initial-fetch-depth: '1'
          filters: |
            backend:
              - 'services/backend/**'
            frontend:
              - 'services/frontend/**'
            notification-service:
              - 'services/notification-service/**'
            cron-checker:
              - 'services/cron-checker/**'

  # ═══════════════════════════════════════════════════════════════════════════
  #  JOB 1 ── test-backend
  # ═══════════════════════════════════════════════════════════════════════════
  test-backend:
    name: Test / backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/backend/package-lock.json
      - run: npm ci
        working-directory: services/backend
      - name: Run tests
        working-directory: services/backend
        run: |
          if npm run 2>/dev/null | grep -q "test"; then npm test
          else echo "No test script — skipping."; fi

  # ═══════════════════════════════════════════════════════════════════════════
  #  JOB 1 ── test-frontend
  # ═══════════════════════════════════════════════════════════════════════════
  test-frontend:
    name: Test / frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
        working-directory: services/frontend
      - name: Run tests
        working-directory: services/frontend
        run: |
          if npm run 2>/dev/null | grep -q "test"; then npm test -- --passWithNoTests --watchAll=false
          else echo "No test script — skipping."; fi

  # ═══════════════════════════════════════════════════════════════════════════
  #  JOB 1 ── test-notification-service
  # ═══════════════════════════════════════════════════════════════════════════
  test-notification-service:
    name: Test / notification-service
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.notification-service == 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/notification-service/package-lock.json
      - run: npm ci
        working-directory: services/notification-service
      - name: Run tests
        working-directory: services/notification-service
        run: |
          if npm run 2>/dev/null | grep -q "test"; then npm test
          else echo "No test script — skipping."; fi

  # ═══════════════════════════════════════════════════════════════════════════
  #  JOB 1 ── test-cron-checker
  # ═══════════════════════════════════════════════════════════════════════════
  test-cron-checker:
    name: Test / cron-checker
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.cron-checker == 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/cron-checker/package-lock.json
      - run: npm ci
        working-directory: services/cron-checker
      - name: Run tests
        working-directory: services/cron-checker
        run: |
          if npm run 2>/dev/null | grep -q "test"; then npm test
          else echo "No test script — skipping."; fi

  # ═══════════════════════════════════════════════════════════════════════════
  #  JOB 2 ── build-scan-push-backend
  # ═══════════════════════════════════════════════════════════════════════════
  build-scan-push-backend:
    name: Build › Scan › Push / backend
    runs-on: ubuntu-latest
    needs: [detect-changes, test-backend]
    if: |
      always() &&
      needs.detect-changes.outputs.backend == 'true' &&
      (needs.test-backend.result == 'success' || needs.test-backend.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/backend
          load: true
          push: false
          tags: ${{ env.ECR_REGISTRY }}/backend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/backend:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Push image to Amazon ECR
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.ECR_REGISTRY }}/backend:${{ env.IMAGE_TAG }}
          docker tag  ${{ env.ECR_REGISTRY }}/backend:${{ env.IMAGE_TAG }} ${{ env.ECR_REGISTRY }}/backend:latest
          docker push ${{ env.ECR_REGISTRY }}/backend:latest

  # ═══════════════════════════════════════════════════════════════════════════
  #  JOB 2 ── build-scan-push-frontend
  # ═══════════════════════════════════════════════════════════════════════════
  build-scan-push-frontend:
    name: Build › Scan › Push / frontend
    runs-on: ubuntu-latest
    needs: [detect-changes, test-frontend]
    if: |
      always() &&
      needs.detect-changes.outputs.frontend == 'true' &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/frontend
          load: true
          push: false
          tags: ${{ env.ECR_REGISTRY }}/frontend:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/frontend:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Push image to Amazon ECR
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.ECR_REGISTRY }}/frontend:${{ env.IMAGE_TAG }}
          docker tag  ${{ env.ECR_REGISTRY }}/frontend:${{ env.IMAGE_TAG }} ${{ env.ECR_REGISTRY }}/frontend:latest
          docker push ${{ env.ECR_REGISTRY }}/frontend:latest

  # ═══════════════════════════════════════════════════════════════════════════
  #  JOB 2 ── build-scan-push-notification-service
  # ═══════════════════════════════════════════════════════════════════════════
  build-scan-push-notification-service:
    name: Build › Scan › Push / notification-service
    runs-on: ubuntu-latest
    needs: [detect-changes, test-notification-service]
    if: |
      always() &&
      needs.detect-changes.outputs.notification-service == 'true' &&
      (needs.test-notification-service.result == 'success' || needs.test-notification-service.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/notification-service
          load: true
          push: false
          tags: ${{ env.ECR_REGISTRY }}/notification-service:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/notification-service:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Push image to Amazon ECR
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.ECR_REGISTRY }}/notification-service:${{ env.IMAGE_TAG }}
          docker tag  ${{ env.ECR_REGISTRY }}/notification-service:${{ env.IMAGE_TAG }} ${{ env.ECR_REGISTRY }}/notification-service:latest
          docker push ${{ env.ECR_REGISTRY }}/notification-service:latest

  # ═══════════════════════════════════════════════════════════════════════════
  #  JOB 2 ── build-scan-push-cron-checker
  # ═══════════════════════════════════════════════════════════════════════════
  build-scan-push-cron-checker:
    name: Build › Scan › Push / cron-checker
    runs-on: ubuntu-latest
    needs: [detect-changes, test-cron-checker]
    if: |
      always() &&
      needs.detect-changes.outputs.cron-checker == 'true' &&
      (needs.test-cron-checker.result == 'success' || needs.test-cron-checker.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./services/cron-checker
          load: true
          push: false
          tags: ${{ env.ECR_REGISTRY }}/cron-checker:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/cron-checker:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Push image to Amazon ECR
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ env.ECR_REGISTRY }}/cron-checker:${{ env.IMAGE_TAG }}
          docker tag  ${{ env.ECR_REGISTRY }}/cron-checker:${{ env.IMAGE_TAG }} ${{ env.ECR_REGISTRY }}/cron-checker:latest
          docker push ${{ env.ECR_REGISTRY }}/cron-checker:latest

  # ═══════════════════════════════════════════════════════════════════════════
  #  JOB 3 ── update-helm
  #  Patches values.yaml for changed services only, one commit, one push.
  #  ArgoCD detects the change and syncs EKS automatically.
  # ═══════════════════════════════════════════════════════════════════════════
  update-helm:
    name: Update Helm Image Tags
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-scan-push-backend
      - build-scan-push-frontend
      - build-scan-push-notification-service
      - build-scan-push-cron-checker
    if: |
      always() &&
      github.event_name != 'pull_request' &&
      (needs.build-scan-push-backend.result == 'success' || needs.build-scan-push-backend.result == 'skipped') &&
      (needs.build-scan-push-frontend.result == 'success' || needs.build-scan-push-frontend.result == 'skipped') &&
      (needs.build-scan-push-notification-service.result == 'success' || needs.build-scan-push-notification-service.result == 'skipped') &&
      (needs.build-scan-push-cron-checker.result == 'success' || needs.build-scan-push-cron-checker.result == 'skipped')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git bot user
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Update image tags for changed services
        env:
          CHANGED_BACKEND:      ${{ needs.detect-changes.outputs.backend }}
          CHANGED_FRONTEND:     ${{ needs.detect-changes.outputs.frontend }}
          CHANGED_NOTIFICATION: ${{ needs.detect-changes.outputs.notification-service }}
          CHANGED_CRON:         ${{ needs.detect-changes.outputs.cron-checker }}
        run: |
          declare -A FLAGS=(
            [backend]="$CHANGED_BACKEND"
            [frontend]="$CHANGED_FRONTEND"
            [notification-service]="$CHANGED_NOTIFICATION"
            [cron-checker]="$CHANGED_CRON"
          )
          for service in backend frontend notification-service cron-checker; do
            if [[ "${FLAGS[$service]}" != "true" ]]; then
              echo "⏭️  $service unchanged — skipping."
              continue
            fi
            VALUES="services/${service}/chart/values.yaml"
            yq -i "
              .image.repository = \"${{ env.ECR_REGISTRY }}/${service}\" |
              .image.tag        = \"${{ env.IMAGE_TAG }}\"
            " "$VALUES"
            echo "✅ Patched $VALUES"
          done

      - name: Commit and push Helm updates
        run: |
          if git diff --quiet services/; then
            echo "No Helm changes — nothing to commit."
            exit 0
          fi
          git add services/backend/chart/values.yaml
          git add services/frontend/chart/values.yaml
          git add services/notification-service/chart/values.yaml
          git add services/cron-checker/chart/values.yaml
          git commit -m "chore(helm): update image tags → ${{ env.IMAGE_TAG }} [skip ci]"
          git push origin main

  # ═══════════════════════════════════════════════════════════════════════════
  #  JOB 4 ── summary  (always runs)
  # ═══════════════════════════════════════════════════════════════════════════
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - test-backend
      - test-frontend
      - test-notification-service
      - test-cron-checker
      - build-scan-push-backend
      - build-scan-push-frontend
      - build-scan-push-notification-service
      - build-scan-push-cron-checker
      - update-helm
    if: always()

    steps:
      - name: Write job summary
        run: |
          echo "# CI/CD Pipeline — Run Summary"                               >> $GITHUB_STEP_SUMMARY
          echo ""                                                              >> $GITHUB_STEP_SUMMARY
          echo "| Job                          | Result |"                    >> $GITHUB_STEP_SUMMARY
          echo "| ---------------------------- | ------ |"                    >> $GITHUB_STEP_SUMMARY
          echo "| Detect Changes               | ${{ needs.detect-changes.result }} |"                         >> $GITHUB_STEP_SUMMARY
          echo "| Test / backend               | ${{ needs.test-backend.result }} |"                           >> $GITHUB_STEP_SUMMARY
          echo "| Test / frontend              | ${{ needs.test-frontend.result }} |"                          >> $GITHUB_STEP_SUMMARY
          echo "| Test / notification-service  | ${{ needs.test-notification-service.result }} |"              >> $GITHUB_STEP_SUMMARY
          echo "| Test / cron-checker          | ${{ needs.test-cron-checker.result }} |"                      >> $GITHUB_STEP_SUMMARY
          echo "| Build / backend              | ${{ needs.build-scan-push-backend.result }} |"                >> $GITHUB_STEP_SUMMARY
          echo "| Build / frontend             | ${{ needs.build-scan-push-frontend.result }} |"               >> $GITHUB_STEP_SUMMARY
          echo "| Build / notification-service | ${{ needs.build-scan-push-notification-service.result }} |"  >> $GITHUB_STEP_SUMMARY
          echo "| Build / cron-checker         | ${{ needs.build-scan-push-cron-checker.result }} |"          >> $GITHUB_STEP_SUMMARY
          echo "| Update Helm                  | ${{ needs.update-helm.result }} |"                            >> $GITHUB_STEP_SUMMARY
          echo ""                                                              >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`"                            >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`"                       >> $GITHUB_STEP_SUMMARY
          echo "**Event:**  ${{ github.event_name }}"                         >> $GITHUB_STEP_SUMMARY
          echo ""                                                              >> $GITHUB_STEP_SUMMARY
          echo "### Changed Services"                                          >> $GITHUB_STEP_SUMMARY
          echo "| Service              | Changed |"                           >> $GITHUB_STEP_SUMMARY
          echo "| -------------------- | ------- |"                           >> $GITHUB_STEP_SUMMARY
          echo "| backend              | ${{ needs.detect-changes.outputs.backend }} |"              >> $GITHUB_STEP_SUMMARY
          echo "| frontend             | ${{ needs.detect-changes.outputs.frontend }} |"             >> $GITHUB_STEP_SUMMARY
          echo "| notification-service | ${{ needs.detect-changes.outputs.notification-service }} |" >> $GITHUB_STEP_SUMMARY
          echo "| cron-checker         | ${{ needs.detect-changes.outputs.cron-checker }} |"         >> $GITHUB_STEP_SUMMARY
          echo ""                                                              >> $GITHUB_STEP_SUMMARY
          echo "> ArgoCD monitors \`main\` and syncs changed services to the EKS cluster automatically." >> $GITHUB_STEP_SUMMARY

# ─────────────────────────────────────────────────────────────────────────────
#  REQUIRED GITHUB SECRETS
#  AWS_ACCOUNT_ID  →  Your 12-digit AWS account ID
#
#  REQUIRED IAM ROLE  (github-actions-ecr)
#  Trust: sts:AssumeRoleWithWebIdentity from token.actions.githubusercontent.com
#  Policy: AmazonEC2ContainerRegistryPowerUser
# ─────────────────────────────────────────────────────────────────────────────
